[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exots"
version = "0.2.0"
description = "A Python server for exposing functions via the Exots IPC bridge."
readme = "README.md"
license = "ISC"
requires-python = ">=3.10"
authors = [
    { name = "sunteya", email = "sunteya@gmail.com" },
]
keywords = ["ipc", "socket", "rpc", "python", "server"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: ISC License (ISCL)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/sunteya/exots"
Source = "https://github.com/sunteya/exots"

[dependency-groups]
dev = [
    "build>=1.2.2",
    "pytest>=9.0.0",
]

[tool.uv]
package = false

[tool.hatch.build.targets.sdist]
include = ["src/exots/**", "LICENSE", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/exots"]
